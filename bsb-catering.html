<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSB Catering</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  /* Farben: hier zentral anpassen (hell und dunkel) */
  :root {
    color-scheme: light dark;
    --bg: #F4F4F1;
    --ink: #121212;
    --muted: #575752;
    --line: #D8D8D2;
    --tile: #121212;
    --tile-ink: #FFFFFF;
    --tile-line: #121212;
    --accent: #F2B01E;
    --on-accent: #121212;
    --focus: #121212;
    --field: #FFFFFF;
    --tile-muted: #C9C9C3;
    --field-line: #8B8B84;
    --error: #B3261E;
    --display: "Young Serif", Georgia, "Times New Roman", serif;
    --text: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C0C0C;
      --ink: #F2F2EE;
      --muted: #A5A5A0;
      --line: #2A2A28;
      --tile: #1D1D1B;
      --tile-line: #343431;
      --accent: #F5BA2E;
      --focus: #F5BA2E;
      --field: #161615;
    --tile-muted: #BDBDB6;
      --field-line: #77776F;
      --error: #FF8A80;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C0C0C;
    --ink: #F2F2EE;
    --muted: #A5A5A0;
    --line: #2A2A28;
    --tile: #1D1D1B;
    --tile-line: #343431;
    --accent: #F5BA2E;
    --focus: #F5BA2E;
    --field: #161615;
    --tile-muted: #BDBDB6;
    --field-line: #77776F;
    --error: #FF8A80;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 1rem/1.55 var(--text);
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  main:focus { outline: none; }

  .shell {
    max-width: 80rem;
    margin: 0 auto;
    padding: clamp(1.25rem, 4vw, 3rem) clamp(1rem, 4vw, 2rem) 4rem;
  }

  /* ---------- Startseite: Icon-Buttons, immer 3 pro Zeile ---------- */
  .home { max-width: 40rem; margin: 0 auto; }
  .brand { margin: 0 0 clamp(1.5rem, 5vw, 2.5rem); }
  .brand h1 {
    font: 400 clamp(2.2rem, 8vw, 3.4rem)/1.05 var(--display);
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }
  .brand p { margin: 0; color: var(--muted); font-size: 1.125rem; }

  .tiles {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(0.6rem, 2.5vw, 1rem);
  }
  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: clamp(0.5rem, 2vw, 0.9rem);
    height: 100%;
    min-height: clamp(6.5rem, 31vw, 12rem);
    padding: clamp(0.9rem, 5vw, 2.25rem) 0.5rem 0.5rem;
    background: var(--tile);
    color: var(--tile-ink);
    border: 1px solid var(--tile-line);
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    font-weight: 600;
    font-size: clamp(0.78rem, 2.9vw, 1rem);
    line-height: 1.25;
    hyphens: auto;
    overflow-wrap: break-word;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  .tile svg {
    width: clamp(2rem, 10vw, 3.25rem);
    height: clamp(2rem, 10vw, 3.25rem);
    flex: none;
    color: var(--accent);
    transition: color 0.15s;
  }
  .tile:focus-visible { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .tile:focus-visible svg { color: var(--on-accent); }
  @media (hover: hover) {
    .tile:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .tile:hover svg { color: var(--on-accent); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, .tile svg { transition: none; }
  }

  /* ---------- Bereichsansicht ---------- */
  .split {
    display: grid;
    grid-template-columns: 13rem minmax(0, 1fr);
    gap: clamp(1.25rem, 3vw, 2.5rem);
    align-items: start;
  }
  .side {
    position: sticky;
    top: calc(1.5rem + env(safe-area-inset-top, 0px));
  }
  .side .brandlink {
    display: inline-block;
    font: 400 1.4rem/1.2 var(--display);
    text-decoration: none;
    margin-bottom: 1.25rem;
  }
  .side ul { list-style: none; margin: 0; padding: 0; }
  .side .navlink {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.5rem 0.75rem;
    border-left: 3px solid transparent;
    text-decoration: none;
  }
  .side .navlink svg { width: 1.25rem; height: 1.25rem; flex: none; color: var(--muted); }
  .side .navlink:hover { background: var(--line); }
  .side .navlink[aria-current="page"] {
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .side .navlink[aria-current="page"] svg { color: var(--ink); }

  .back {
    display: none;
    align-items: center;
    gap: 0.35rem;
    margin-bottom: 1.25rem;
    color: var(--muted);
    text-decoration: none;
  }
  .back:hover { color: var(--ink); text-decoration: underline; }
  .back svg { width: 1em; height: 1em; }

  .content h1 {
    font: 400 clamp(1.9rem, 5vw, 2.6rem)/1.1 var(--display);
    margin: 0 0 0.5rem;
  }
  .content .lead { margin: 0; color: var(--muted); font-size: 1.125rem; }

  .empty {
    margin-top: 2rem;
    max-width: 36rem;
    padding: 1.5rem;
    border: 2px dashed var(--line);
    border-radius: 8px;
  }
  .empty h2 { font: 400 1.25rem/1.2 var(--display); margin: 0 0 0.4rem; }
  .empty p { margin: 0; color: var(--muted); }

  @media (max-width: 859px) {
    .split { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    .back { display: inline-flex; }
  }

  /* ---------- Formulare ---------- */
  .form { max-width: 36rem; margin-top: 2rem; display: grid; gap: 1.4rem; }
  .field { min-width: 0; margin: 0; padding: 0; border: 0; }
  .label { display: block; padding: 0; margin: 0 0 0.35rem; font-weight: 600; }
  .hint { margin: -0.15rem 0 0.45rem; color: var(--muted); font-size: 0.9rem; }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }

  .input {
    display: block;
    width: 100%;
    min-height: 3rem;
    padding: 0.6rem 0.8rem;
    background: var(--field);
    color: var(--ink);
    border: 1.5px solid var(--field-line);
    border-radius: 8px;
    font: 400 1rem/1.3 var(--text);
  }
  .input:hover { border-color: var(--ink); }
  .input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--ink); }
  .input[aria-invalid="true"] { border-color: var(--error); }
  .suffix-wrap { position: relative; }
  .suffix-wrap .input { padding-right: 2.5rem; }
  .suffix { position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  .choices { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .choice-box {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 3rem;
    padding: 0 1.1rem;
    background: var(--field);
    color: var(--ink);
    border: 1.5px solid var(--field-line);
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .choice-box svg { display: none; width: 1.1em; height: 1.1em; flex: none; color: var(--accent); }
  .choice:hover .choice-box { border-color: var(--ink); }
  .choice input:checked + .choice-box {
    background: var(--tile);
    color: var(--tile-ink);
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .choice input:checked + .choice-box svg { display: block; }
  .choice input:focus-visible + .choice-box { outline: 3px solid var(--focus); outline-offset: 2px; }

  .error { margin: 0.4rem 0 0; color: var(--error); font-size: 0.9rem; font-weight: 500; }
  .error[hidden] { display: none; }

  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.4rem; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 3.25rem;
    padding: 0 1.75rem;
    background: var(--tile);
    color: var(--tile-ink);
    border: 1px solid var(--tile-line);
    border-radius: 12px;
    font: 600 1rem/1.2 var(--text);
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn-primary { min-width: 12rem; }
  .btn:focus-visible { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  @media (hover: hover) {
    .btn:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  }
  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--field-line); }
  .btn[disabled] { opacity: 0.6; cursor: progress; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

  .done {
    max-width: 36rem;
    margin-top: 2rem;
    padding: 1.5rem;
    background: var(--field);
    border: 1.5px solid var(--field-line);
    border-left: 8px solid var(--accent);
    border-radius: 8px;
  }
  .done h2 { font: 400 1.5rem/1.2 var(--display); margin: 0 0 0.5rem; }
  .done h2:focus { outline: none; }
  .done p { margin: 0 0 0.75rem; }
  .done .note { color: var(--muted); }

  @media (max-width: 419px) {
    .row2 { grid-template-columns: minmax(0, 1fr); }
    .btn-primary, .btn-secondary { width: 100%; }
  }
  /* ---------- Eventübersicht ---------- */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .note { color: var(--muted); }
  .note[hidden] { display: none; }
  .ue-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 1.75rem 0 1.25rem; }
  .segmented { display: inline-flex; }
  .seg {
    min-height: 2.75rem;
    padding: 0 1.25rem;
    background: var(--field);
    color: var(--ink);
    border: 1.5px solid var(--field-line);
    font: 600 1rem/1 var(--text);
    cursor: pointer;
  }
  .seg:first-child { border-radius: 12px 0 0 12px; }
  .seg:last-child { border-radius: 0 12px 12px 0; margin-left: -1.5px; }
  .seg[aria-pressed="true"] {
    position: relative;
    background: var(--tile);
    color: var(--tile-ink);
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .seg:focus-visible { position: relative; z-index: 2; outline: 3px solid var(--focus); outline-offset: 2px; }

  .cal-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
  .cal-title { font: 400 1.5rem/1.2 var(--display); margin: 0 0.5rem; min-width: 10.5rem; text-align: center; }
  .iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    background: var(--field);
    color: var(--ink);
    border: 1.5px solid var(--field-line);
    border-radius: 10px;
    cursor: pointer;
  }
  .iconbtn svg { width: 1.25rem; height: 1.25rem; }
  @media (hover: hover) {
    .iconbtn:hover, .seg:not([aria-pressed="true"]):hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  }
  .btn-small { min-height: 2.75rem; padding: 0 1rem; margin-left: auto; }

  .cal-table { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--field); border: 1.5px solid var(--field-line); }
  .cal-table th {
    padding: 0.5rem 0.6rem;
    background: var(--tile);
    color: var(--tile-ink);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: left;
  }
  .cal-table td { height: 7.5rem; padding: 0.25rem; vertical-align: top; border: 1px solid var(--line); overflow: hidden; }
  .cal-table td.fremd { background: var(--bg); }
  .cal-table td.fremd .cal-num { color: var(--muted); }
  .cal-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.75rem;
    height: 1.75rem;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .cal-table td.heute .cal-num { background: var(--accent); color: var(--on-accent); }
  .cal-full { display: none; font-weight: 600; }

  .ev {
    display: block;
    margin-top: 0.3rem;
    padding: 0.3rem 0.4rem;
    background: var(--tile);
    color: var(--tile-ink);
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    font-size: 0.8rem;
    line-height: 1.25;
    text-decoration: none;
    hyphens: auto;
    overflow-wrap: break-word;
  }
  .ev-name { display: block; font-weight: 600; }
  .ev-ort { display: block; color: var(--tile-muted); }
  .ev:focus-visible { background: var(--accent); color: var(--on-accent); }
  .ev:focus-visible .ev-ort { color: var(--on-accent); }
  @media (hover: hover) {
    .ev:hover { background: var(--accent); color: var(--on-accent); }
    .ev:hover .ev-ort { color: var(--on-accent); }
  }

  .table-wrap { overflow-x: auto; background: var(--field); border: 1.5px solid var(--field-line); border-radius: 8px; }
  .evtable { width: 100%; min-width: 46rem; border-collapse: collapse; font-size: 0.92rem; }
  .evtable th {
    padding: 0.65rem 0.7rem;
    background: var(--tile);
    color: var(--tile-ink);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
  }
  .evtable td { padding: 0.65rem 0.7rem; vertical-align: top; border-top: 1px solid var(--line); }
  .evtable .num { text-align: right; white-space: nowrap; }
  .evtable .nowrap { white-space: nowrap; }
  .evtable .datum span { display: block; white-space: nowrap; }
  .evtable .datum .zeit { color: var(--muted); }
  .evtable .event { min-width: 9.5rem; }
  .evtable .ort { min-width: 7rem; }
  .evtable .marke span { display: block; white-space: nowrap; }
  .evtable td a { font-weight: 600; }
  .evtable tbody tr { cursor: pointer; }
  @media (hover: hover) { .evtable tbody tr:hover { background: var(--line); } }

  .crumb { display: inline-flex; align-items: center; gap: 0.35rem; margin: 1.75rem 0 1rem; color: var(--muted); text-decoration: none; }
  .crumb svg { width: 1em; height: 1em; }
  .crumb:hover { color: var(--ink); text-decoration: underline; }
  .notice {
    max-width: 40rem;
    margin: 0 0 1rem;
    padding: 0.7rem 1rem;
    background: var(--field);
    border: 1.5px solid var(--field-line);
    border-left: 6px solid var(--accent);
    border-radius: 6px;
    font-weight: 600;
  }
  .detail {
    max-width: 40rem;
    padding: 1.5rem;
    background: var(--field);
    border: 1.5px solid var(--field-line);
    border-left: 8px solid var(--accent);
    border-radius: 8px;
  }
  .detail h2 { font: 400 1.75rem/1.2 var(--display); margin: 0 0 0.6rem; overflow-wrap: anywhere; }
  .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1.25rem; }
  .badge { padding: 0.15rem 0.7rem; background: var(--tile); color: var(--tile-ink); border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
  .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.7rem 1.5rem; margin: 0 0 1.5rem; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .subhead { font: 400 1.5rem/1.2 var(--display); margin: 0; }
  .empty .actions { margin-top: 1rem; }

  @media (max-width: 719px) {
    .cal-table, .cal-table tbody, .cal-table tr, .cal-table td { display: block; }
    .cal-table thead { display: none; }
    .cal-table { background: transparent; border: 0; }
    .cal-table td { height: auto; padding: 0.9rem 0; border: 0; border-top: 1px solid var(--line); }
    .cal-table td.leer, .cal-table td.fremd { display: none; }
    .cal-num { display: none; }
    .cal-full { display: block; margin-bottom: 0.15rem; }
    .cal-table td.heute .cal-full { text-decoration: underline 3px var(--accent); text-underline-offset: 0.2em; }
    .ev { font-size: 0.95rem; }
  }
  @media (max-width: 479px) {
    .facts { grid-template-columns: minmax(0, 1fr); gap: 0.1rem; }
    .facts dd { margin-bottom: 0.7rem; }
    .cal-title { min-width: 0; flex: 1; }
    .btn.btn-small { width: auto; }
  }
  .select-wrap { position: relative; }
  select.input { appearance: none; -webkit-appearance: none; padding-right: 2.75rem; text-overflow: ellipsis; cursor: pointer; }
  .select-wrap svg { position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%); width: 1.25rem; height: 1.25rem; color: var(--muted); pointer-events: none; }
</style>



</head>
<body>
<div class="shell" id="app"></div>

<script>
/* =====================================================================
   SO ERWEITERST DU DIE ANWENDUNG

   1. Neuer Bereich:  Eintrag in MODULES ergänzen (id, title, hint, icon, render).
                      Optional: tileLabel mit weichen Trennstellen (\u00AD) für lange Wörter.
                      Die Reihenfolge in der Liste bestimmt die Reihenfolge der
                      Buttons; es werden immer 3 pro Zeile angezeigt.
   2. Neues Icon:     in ICONS ergänzen (SVG-Linien im 24x24-Raster).
   3. Inhalt eines Bereichs: die Funktion render(container, module, param) füllt den
      Inhaltsbereich. Solange sie nicht ersetzt ist, zeigt der Bereich den
      Platzhalter "placeholder". param ist der Adressteil hinter dem Bereich,
      z. B. bei #/event-uebersicht/123/bearbeiten also "123/bearbeiten".

   4. Daten speichern und lesen: über Store (siehe "Datenablage"). Neue
      Funktionen wie die Eventübersicht lesen dort die gespeicherten Events.

   Startseite, Navigation und Adressen (#/event-anlegen usw.) entstehen
   automatisch aus MODULES.
   ===================================================================== */

const APP_NAME = 'BSB Catering';

const ICONS = {
  'event-anlegen':
    '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>',
  'event-bearbeiten':
    '<path d="M4 20l1.2-4.2L16.6 4.4a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8.2 18.8z"/><path d="M14.5 6.5l3 3"/>',
  'event-uebersicht':
    '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>',
  'speisekarte-erzeugen':
    '<rect x="3" y="3" width="12" height="18" rx="2"/><path d="M7 8h4M7 12h3"/><path d="M19 13.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  'speisekarte-bearbeiten':
    '<rect x="3" y="3" width="11" height="18" rx="2"/><path d="M7 8h3M7 12h3"/><path d="M16 20.5l.7-2.5 4-4a1.3 1.3 0 011.8 1.8l-4 4z"/>',
  'abrechnungsdaten':
    '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8h5M9.5 12h5"/>',
  'statistik':
    '<path d="M3 21h18"/><path d="M6 21v-6M12 21V6M18 21v-10" stroke-width="3"/>',
};

function placeholder(container) {
  container.append(
    h('div', { class: 'empty' },
      h('h2', {}, 'Dieser Bereich folgt im nächsten Schritt'),
      h('p', {}, 'Die Oberfläche steht. Die Funktionen für diesen Bereich werden als Nächstes ergänzt.')
    )
  );
}

/* ---------- Datenablage ----------
   Alle Bereiche speichern und lesen ihre Daten über Store.
   Ist der Server-Speicher verfügbar, liegen die Daten dort (auf allen Geräten
   gleich). Sonst dient der Browser dieses Geräts als Ersatz. Beim Lesen werden
   beide Quellen zusammengeführt, damit kein Event verschwindet. */
const Store = (() => {
  const LOCAL_KEY = 'bsb-catering.events';
  const CACHE_MS = 60000;
  const dbPromise = (window.claude && typeof window.claude.use === 'function')
    ? Promise.resolve().then(() => window.claude.use('db')).catch(() => null)
    : Promise.resolve(null);
  const timeout = ms => new Promise(res => setTimeout(() => res(null), ms));
  const getDb = () => Promise.race([dbPromise, timeout(4000)]);

  let cache = null;
  let cacheAt = 0;

  // "_lokal" markiert Events, die nur im Browser liegen; es wird nie gespeichert.
  const clean = ev => { const c = Object.assign({}, ev); delete c._lokal; return c; };

  function readLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch (e) { return []; }
  }
  function writeLocal(list) { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); }

  async function listEvents(force) {
    if (!force && cache && Date.now() - cacheAt < CACHE_MS) return cache;
    const db = await getDb();
    const list = [];
    if (db) {
      const snap = await db.collection('events').get();
      snap.docs.forEach(d => list.push(Object.assign({}, d.data())));
    }
    const ids = new Set(list.map(e => e.id));
    readLocal().forEach(e => { if (!ids.has(e.id)) list.push(Object.assign({ _lokal: true }, e)); });
    cache = list;
    cacheAt = Date.now();
    return list;
  }

  async function saveEvent(ev) {
    const db = await getDb();
    if (db) {
      await db.collection('events').doc(ev.id).set(ev);
      if (cache) cache.push(ev);
      return { where: 'server' };
    }
    const list = readLocal();
    list.push(ev);
    writeLocal(list);
    if (cache) cache.push(Object.assign({ _lokal: true }, ev));
    return { where: 'browser' };
  }

  async function updateEvent(ev) {
    const data = clean(ev);
    if (ev._lokal) {
      writeLocal(readLocal().map(e => (e.id === data.id ? data : e)));
    } else {
      const db = await getDb();
      if (!db) throw new Error('Server-Speicher nicht verfügbar');
      await db.collection('events').doc(data.id).set(data);
    }
    if (cache) cache = cache.map(e => (e.id === ev.id ? ev : e));
  }

  return { listEvents, saveEvent, updateEvent };
})();

/* ---------- Formularbausteine ---------- */
const newId = () => (window.crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const formatDate = iso => iso.split('-').reverse().join('.');
function parseEuro(text) {
  const t = text.trim().replace(/\s/g, '').replace(',', '.');
  return /^\d+(\.\d{1,2})?$/.test(t) ? Math.round(parseFloat(t) * 100) / 100 : null;
}

function errorLine(id) { return h('p', { class: 'error', id: id + '-fehler', hidden: true }); }

function textField({ id, label, hint, type, suffix, attrs }) {
  const err = errorLine(id);
  const input = h('input', Object.assign(
    { id, name: id, type: type || 'text', class: 'input', autocomplete: 'off' }, attrs || {}));
  input.setAttribute('aria-describedby', (hint ? id + '-hinweis ' : '') + id + '-fehler');
  const control = suffix
    ? h('div', { class: 'suffix-wrap' }, input, h('span', { class: 'suffix', 'aria-hidden': 'true' }, suffix))
    : input;
  const api = {
    input,
    el: h('div', { class: 'field' },
      h('label', { class: 'label', for: id }, label),
      hint ? h('p', { class: 'hint', id: id + '-hinweis' }, hint) : null,
      control,
      err),
    focus: () => input.focus(),
    setError(msg) {
      err.textContent = msg || '';
      err.hidden = !msg;
      if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    },
  };
  input.addEventListener('input', () => api.setError(''));
  return api;
}

function choiceGroup({ name, legend, hint, type, options }) {
  const err = errorLine(name);
  const inputs = options.map(([value]) => h('input', { type, name, value }));
  const api = {
    inputs,
    el: h('fieldset', { class: 'field', 'aria-describedby': (hint ? name + '-hinweis ' : '') + name + '-fehler' },
      h('legend', { class: 'label' }, legend),
      hint ? h('p', { class: 'hint', id: name + '-hinweis' }, hint) : null,
      h('div', { class: 'choices' },
        options.map(([, text], i) =>
          h('label', { class: 'choice' },
            inputs[i],
            h('span', { class: 'choice-box' }, svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', '2.4'), text)))),
      err),
    values: () => inputs.filter(i => i.checked).map(i => i.value),
    focus: () => inputs[0].focus(),
    setError(msg) { err.textContent = msg || ''; err.hidden = !msg; },
  };
  inputs.forEach(i => i.addEventListener('change', () => api.setError('')));
  return api;
}

const MARKEN = { 'bsb-catering': 'BSB Catering', 'ape-roll': 'APE-ROLL' };
const VERRECHNUNG = { pauschal: 'Pauschal', abrechnung: 'Abrechnung' };

/* ---------- Event-Formular (zum Anlegen und Bearbeiten) ----------
   initial:     vorhandenes Event zum Vorausfüllen (nur beim Bearbeiten)
   save(werte): speichert; bei einem Fehler eine Exception werfen */
function buildEventForm({ initial, submitLabel, cancelHref, save }) {
  const marke   = choiceGroup({ name: 'marke', legend: 'Marke', hint: 'Eine oder beide auswählen', type: 'checkbox',
                                options: Object.entries(MARKEN) });
  const name    = textField({ id: 'eventname', label: 'Eventname' });
  const ort     = textField({ id: 'ort', label: 'Veranstaltungsort' });
  const kunde   = textField({ id: 'kunde', label: 'Kundenname' });
  const start   = textField({ id: 'startdatum', label: 'Startdatum', type: 'date' });
  const ende    = textField({ id: 'enddatum', label: 'Enddatum', type: 'date' });
  const zeit    = textField({ id: 'startzeit', label: 'Startuhrzeit', type: 'time' });
  const gaeste  = textField({ id: 'gaeste', label: 'Anzahl Gäste', type: 'number',
                              attrs: { min: '1', step: '1', inputmode: 'numeric' } });
  const verr    = choiceGroup({ name: 'verrechnung', legend: 'Verrechnung', type: 'radio',
                                options: Object.entries(VERRECHNUNG) });
  const gebuehr = textField({ id: 'standgebuehr', label: 'Standgebühr', suffix: '€',
                              hint: 'Bei keiner Standgebühr 0 eintragen.',
                              attrs: { inputmode: 'decimal', placeholder: '0,00' } });

  if (initial) {
    marke.inputs.forEach(i => { i.checked = (initial.marken || []).includes(i.value); });
    name.input.value = initial.name || '';
    ort.input.value = initial.ort || '';
    kunde.input.value = initial.kunde || '';
    start.input.value = initial.startDatum || '';
    ende.input.value = initial.endDatum || '';
    ende.input.min = initial.startDatum || '';
    zeit.input.value = initial.startzeit || '';
    gaeste.input.value = initial.gaeste != null ? String(initial.gaeste) : '';
    verr.inputs.forEach(i => { i.checked = i.value === initial.verrechnung; });
    gebuehr.input.value = Number(initial.standgebuehr || 0).toFixed(2).replace('.', ',');
  }

  const checks = [
    [marke,   () => marke.values().length ? '' : 'Bitte mindestens eine Marke auswählen.'],
    [name,    () => name.input.value.trim()  ? '' : 'Bitte einen Eventnamen eingeben.'],
    [ort,     () => ort.input.value.trim()   ? '' : 'Bitte den Veranstaltungsort eingeben.'],
    [kunde,   () => kunde.input.value.trim() ? '' : 'Bitte den Kundennamen eingeben.'],
    [start,   () => start.input.value ? '' : 'Bitte ein Startdatum wählen.'],
    [ende,    () => !ende.input.value ? 'Bitte ein Enddatum wählen.'
                  : (start.input.value && ende.input.value < start.input.value ? 'Das Enddatum liegt vor dem Startdatum.' : '')],
    [zeit,    () => zeit.input.value ? '' : 'Bitte die Startuhrzeit angeben.'],
    [gaeste,  () => {
                const n = Number(gaeste.input.value);
                return gaeste.input.value !== '' && Number.isInteger(n) && n >= 1 ? '' : 'Bitte eine Gästezahl von mindestens 1 eingeben.';
              }],
    [verr,    () => verr.values().length ? '' : 'Bitte Pauschal oder Abrechnung auswählen.'],
    [gebuehr, () => parseEuro(gebuehr.input.value) !== null ? '' : 'Bitte einen Betrag wie 250 oder 250,50 eingeben. Bei keiner Gebühr 0 eintragen.'],
  ];

  // Enddatum folgt dem Startdatum, solange es nicht davor liegt
  start.input.addEventListener('change', () => {
    ende.input.min = start.input.value;
    if (start.input.value && (!ende.input.value || ende.input.value < start.input.value)) {
      ende.input.value = start.input.value;
    }
    ende.setError('');
  });

  const saveBtn = h('button', { type: 'submit', class: 'btn btn-primary' }, submitLabel);
  const status = h('p', { class: 'error', role: 'alert', hidden: true });
  const form = h('form', { class: 'form', novalidate: true },
    marke.el, name.el, ort.el, kunde.el,
    h('div', { class: 'row2' }, start.el, ende.el),
    h('div', { class: 'row2' }, zeit.el, gaeste.el),
    verr.el, gebuehr.el,
    h('div', { class: 'actions' },
      saveBtn,
      h('a', { class: 'btn btn-secondary', href: cancelHref }, 'Abbrechen')
    ),
    status
  );

  form.addEventListener('submit', async e => {
    e.preventDefault();
    status.hidden = true;

    let first = null;
    for (const [api, check] of checks) {
      const msg = check();
      api.setError(msg);
      if (msg && !first) first = api;
    }
    if (first) { first.focus(); return; }

    const werte = {
      marken: marke.values(),
      name: name.input.value.trim(),
      ort: ort.input.value.trim(),
      kunde: kunde.input.value.trim(),
      startDatum: start.input.value,
      endDatum: ende.input.value,
      startzeit: zeit.input.value,
      gaeste: Number(gaeste.input.value),
      verrechnung: verr.values()[0],
      standgebuehr: parseEuro(gebuehr.input.value),
    };

    saveBtn.disabled = true;
    saveBtn.textContent = 'Speichert …';
    try {
      await save(werte);
    } catch (err) {
      status.textContent = 'Das Event konnte nicht gespeichert werden. Bitte versuche es erneut.';
      status.hidden = false;
      saveBtn.disabled = false;
      saveBtn.textContent = submitLabel;
    }
  });

  return form;
}

/* ---------- Bereich: Event anlegen ---------- */
function renderEventAnlegen(container) {
  function showSaved(ev, res) {
    const heading = h('h2', { tabindex: '-1' }, 'Event gespeichert');
    const again = h('button', { type: 'button', class: 'btn btn-secondary' }, 'Weiteres Event anlegen');
    again.addEventListener('click', () => {
      container.replaceChildren();
      renderEventAnlegen(container);
      const first = container.querySelector('input');
      if (first) first.focus();
    });
    container.replaceChildren(
      h('section', { class: 'done', role: 'status' },
        heading,
        h('p', {}, '„' + ev.name + '“ (' + datumText(ev) + ') wurde gespeichert.'),
        res.where === 'browser'
          ? h('p', { class: 'note' }, 'Hinweis: Der Server-Speicher ist gerade nicht verfügbar. Das Event liegt nur in diesem Browser.')
          : null,
        h('div', { class: 'actions' },
          h('a', { class: 'btn btn-primary', href: '#/event-uebersicht' }, 'Zur Eventübersicht'),
          again
        )
      )
    );
    heading.focus();
  }

  container.append(buildEventForm({
    submitLabel: 'Speichern',
    cancelHref: '#/',
    save: async werte => {
      const ev = Object.assign({ id: newId() }, werte, { erstelltAm: new Date().toISOString() });
      const res = await Store.saveEvent(ev);
      showSaved(ev, res);
    },
  }));
}

/* ---------- Bereich: Eventübersicht ----------
   Adressen:  #/event-uebersicht                 Kalender oder Tabelle
              #/event-uebersicht/<id>            Details eines Events
              #/event-uebersicht/<id>/bearbeiten Event bearbeiten */
const now0 = new Date();
const ueState = { mode: 'kalender', year: now0.getFullYear(), month: now0.getMonth(), flash: '' };

const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const WOCHENTAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const WOCHENTAGE_LANG = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

const pad2 = n => String(n).padStart(2, '0');
const isoDate = (y, m0, d) => y + '-' + pad2(m0 + 1) + '-' + pad2(d);
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
function weekdayIndex(iso) {           // Montag = 0
  const [y, m, d] = iso.split('-').map(Number);
  return (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7;
}
function todayIso() { const t = new Date(); return isoDate(t.getFullYear(), t.getMonth(), t.getDate()); }

const byStart = (a, b) =>
  ((a.startDatum || '') + (a.startzeit || '')).localeCompare((b.startDatum || '') + (b.startzeit || ''))
  || (a.name || '').localeCompare(b.name || '', 'de');
const markenText = ev => (ev.marken || []).map(k => MARKEN[k] || k).join(', ');
const euro = n => Number(n || 0).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const eventHref = (ev, extra) => '#/event-uebersicht/' + ev.id + (extra ? '/' + extra : '');
function datumText(ev) {
  return ev.endDatum && ev.endDatum !== ev.startDatum
    ? formatDate(ev.startDatum) + ' bis ' + formatDate(ev.endDatum)
    : formatDate(ev.startDatum);
}
function stampText(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('de-AT', { dateStyle: 'medium', timeStyle: 'short' });
}
const chevron = dir => svg(dir === 'left' ? '<path d="M15 5l-7 7 7 7"/>' : '<path d="M9 5l7 7-7 7"/>', '2');

/* --- Kalender --- */
function monthTable(events, year, m0) {
  const first = isoDate(year, m0, 1);
  const daysInMonth = new Date(Date.UTC(year, m0 + 1, 0)).getUTCDate();
  const lead = weekdayIndex(first);
  const weeks = Math.ceil((lead + daysInMonth) / 7);
  const gridStart = addDays(first, -lead);
  const gridEnd = addDays(gridStart, weeks * 7 - 1);
  const monthKey = first.slice(0, 7);
  const today = todayIso();

  const byDay = new Map();
  for (const ev of events) {
    const von = ev.startDatum;
    const bis = ev.endDatum || ev.startDatum;
    if (!von) continue;
    let d = von > gridStart ? von : gridStart;
    const last = bis < gridEnd ? bis : gridEnd;
    for (; d <= last; d = addDays(d, 1)) {
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(ev);
    }
  }
  const inMonth = new Set();

  const rows = [];
  for (let w = 0; w < weeks; w++) {
    const cells = [];
    for (let i = 0; i < 7; i++) {
      const date = addDays(gridStart, w * 7 + i);
      const list = (byDay.get(date) || []).slice().sort(byStart);
      const mine = date.slice(0, 7) === monthKey;
      if (mine) list.forEach(ev => inMonth.add(ev.id));
      const cls = ['cal-day', mine ? '' : 'fremd', list.length ? 'hat-events' : 'leer', date === today ? 'heute' : '']
        .filter(Boolean).join(' ');
      cells.push(h('td', { class: cls },
        h('div', { class: 'cal-date' },
          h('span', { class: 'cal-num' }, String(Number(date.slice(8)))),
          h('span', { class: 'cal-full' }, WOCHENTAGE[i] + ', ' + date.slice(8) + '.' + date.slice(5, 7) + '.')
        ),
        list.map(ev =>
          h('a', { class: 'ev', href: eventHref(ev), title: ev.name + ', ' + ev.ort },
            h('span', { class: 'ev-name' }, ev.name),
            h('span', { class: 'ev-ort' }, ev.ort))
        )
      ));
    }
    rows.push(h('tr', {}, cells));
  }

  const table = h('table', { class: 'cal-table' },
    h('caption', { class: 'sr-only' }, 'Kalender ' + MONATE[m0] + ' ' + year),
    h('thead', {}, h('tr', {}, WOCHENTAGE.map((t, i) => h('th', { scope: 'col', abbr: WOCHENTAGE_LANG[i] }, t)))),
    h('tbody', {}, rows)
  );
  return { table, count: inMonth.size };
}

function calendarView(events) {
  const title = h('h2', { class: 'cal-title', 'aria-live': 'polite' });
  const holder = h('div', {});
  const note = h('p', { class: 'note' });
  const prev = h('button', { type: 'button', class: 'iconbtn', 'aria-label': 'Vorheriger Monat' }, chevron('left'));
  const next = h('button', { type: 'button', class: 'iconbtn', 'aria-label': 'Nächster Monat' }, chevron('right'));
  const heute = h('button', { type: 'button', class: 'btn btn-secondary btn-small' }, 'Heute');

  function fill() {
    const { table, count } = monthTable(events, ueState.year, ueState.month);
    title.textContent = MONATE[ueState.month] + ' ' + ueState.year;
    holder.replaceChildren(table);
    note.textContent = count ? '' : 'In diesem Monat gibt es keine Events.';
    note.hidden = count > 0;
  }
  function shift(delta) {
    let m = ueState.month + delta;
    if (m < 0) { m = 11; ueState.year--; } else if (m > 11) { m = 0; ueState.year++; }
    ueState.month = m;
    fill();
  }
  prev.addEventListener('click', () => shift(-1));
  next.addEventListener('click', () => shift(1));
  heute.addEventListener('click', () => {
    const t = new Date();
    ueState.year = t.getFullYear();
    ueState.month = t.getMonth();
    fill();
  });
  fill();

  return h('div', {}, h('div', { class: 'cal-bar' }, prev, title, next, heute), holder, note);
}

/* --- Tabelle: neue Spalte = neuer Eintrag in dieser Liste --- */
const TABLE_COLUMNS = [
  { title: 'Datum',         cell: ev => [h('span', {}, formatDate(ev.startDatum)),
                                         ev.endDatum && ev.endDatum !== ev.startDatum ? h('span', {}, 'bis ' + formatDate(ev.endDatum)) : null,
                                         h('span', { class: 'zeit' }, ev.startzeit + ' Uhr')],
    cls: 'datum' },
  { title: 'Event',         cell: ev => h('a', { href: eventHref(ev) }, ev.name), cls: 'event' },
  { title: 'Ort',           cell: ev => ev.ort, cls: 'ort' },
  { title: 'Kunde',         cell: ev => ev.kunde },
  { title: 'Marke',         cell: ev => (ev.marken || []).map(k => h('span', {}, MARKEN[k] || k)), cls: 'marke' },
  { title: 'Gäste',         cell: ev => String(ev.gaeste), cls: 'num' },
  { title: 'Verrechnung',   cell: ev => VERRECHNUNG[ev.verrechnung] || ev.verrechnung, cls: 'nowrap' },
  { title: 'Standgebühr',   cell: ev => euro(ev.standgebuehr), cls: 'num' },
];

function tableView(events) {
  const rows = events.slice().sort(byStart).map(ev => {
    const tr = h('tr', {}, TABLE_COLUMNS.map(c => h('td', { class: c.cls || false }, c.cell(ev))));
    tr.addEventListener('click', e => { if (!e.target.closest('a')) location.hash = eventHref(ev); });
    return tr;
  });
  return h('div', { class: 'table-wrap', role: 'region', 'aria-label': 'Eventtabelle', tabindex: '0' },
    h('table', { class: 'evtable' },
      h('thead', {}, h('tr', {}, TABLE_COLUMNS.map(c => h('th', { scope: 'col', class: c.cls === 'num' ? 'num' : false }, c.title)))),
      h('tbody', {}, rows)
    )
  );
}

function overviewView(events) {

    h('h2', {}, 'Event nicht gefunden'),
    h('p', {}, 'Zu dieser Adresse gibt es kein Event.'),
    h('div', { class: 'actions' }, h('a', { class: 'btn btn-primary', href: '#/event-uebersicht' }, 'Zur Übersicht'))
  );
}

function renderUebersicht(container, mod, param) {
  const [id, aktion] = (param || '').split('/');
  const loading = () => h('p', { class: 'note' }, 'Events werden geladen …');
  const wrap = h('div', {}, loading());
  container.append(wrap);

  function load(force) {
    Store.listEvents(force).then(events => {
      if (!wrap.isConnected) return;
      let view;
      if (!id) {
        view = overviewView(events);
      } else {
        const ev = events.find(e => e.id === id);
        view = !ev ? notFoundView() : aktion === 'bearbeiten' ? editView(ev) : detailView(ev);
      }
      wrap.replaceChildren(view);
    }).catch(() => {
      if (!wrap.isConnected) return;
      const retry = h('button', { type: 'button', class: 'btn btn-secondary' }, 'Erneut versuchen');
      retry.addEventListener('click', () => { wrap.replaceChildren(loading()); load(true); });
      wrap.replaceChildren(h('div', { class: 'empty' },
        h('h2', {}, 'Events konnten nicht geladen werden'),
        h('p', {}, 'Bitte prüfe die Verbindung und versuche es erneut.'),
        h('div', { class: 'actions' }, retry)));
    });
  }
  load(false);
}

/* ---------- Bereich: Event bearbeiten ----------
   Dropdown mit allen Events, die noch nicht vorbei sind (Enddatum heute oder später),
   sortiert nach Startdatum und Kundenname. Nach der Auswahl erscheint das Formular. */
const byDatumKunde = (a, b) =>
  (a.startDatum || '').localeCompare(b.startDatum || '')
  || (a.kunde || '').localeCompare(b.kunde || '', 'de');

function bearbeitenView(events, onSaved) {
  const heute = todayIso();
  const kommende = events
    .filter(e => (e.endDatum || e.startDatum || '') >= heute)
    .sort(byDatumKunde);

  if (!kommende.length) {
    return h('div', { class: 'empty' },
      h('h2', {}, 'Keine zukünftigen Events'),
      h('p', {}, 'Es gibt kein Event, das noch bearbeitet werden kann. Vergangene Events findest du in der Eventübersicht.'),
      h('div', { class: 'actions' },
        h('a', { class: 'btn btn-primary', href: '#/event-anlegen' }, 'Event anlegen'),
        h('a', { class: 'btn btn-secondary', href: '#/event-uebersicht' }, 'Zur Eventübersicht'))
    );
  }

  const select = h('select', { id: 'eventauswahl', class: 'input', 'aria-describedby': 'eventauswahl-hinweis' },
    h('option', { value: '' }, 'Bitte ein Event wählen'),
    kommende.map(ev => h('option', { value: ev.id },
      formatDate(ev.startDatum) + ' – ' + ev.kunde + ' – ' + ev.name))
  );
  const formArea = h('div', {});
  select.addEventListener('change', () => {
    formArea.replaceChildren();
    const ev = kommende.find(e => e.id === select.value);
    if (!ev) return;
    formArea.append(buildEventForm({
      initial: ev,
      submitLabel: 'Speichern',
      cancelHref: '#/',
      save: async werte => {
        const neu = Object.assign({}, ev, werte, { geaendertAm: new Date().toISOString() });
        await Store.updateEvent(neu);
        onSaved(neu);
      },
    }));
  });

  return h('div', {},
    h('div', { class: 'form' },
      h('div', { class: 'field' },
        h('label', { class: 'label', for: 'eventauswahl' }, 'Event auswählen'),
        h('p', { class: 'hint', id: 'eventauswahl-hinweis' }, 'Zukünftige Events, sortiert nach Datum und Kundenname'),
        h('div', { class: 'select-wrap' }, select, svg('<path d="M6 9l6 6 6-6"/>', '2'))
      )
    ),
    formArea
  );
}

function renderEventBearbeiten(container) {
  const loading = () => h('p', { class: 'note' }, 'Events werden geladen …');
  const wrap = h('div', {}, loading());
  container.append(wrap);

  function showSaved(ev) {
    const heading = h('h2', { tabindex: '-1' }, 'Änderungen gespeichert');
    const again = h('button', { type: 'button', class: 'btn btn-secondary' }, 'Weiteres Event bearbeiten');
    again.addEventListener('click', () => {
      container.replaceChildren();
      renderEventBearbeiten(container);
    });
    wrap.replaceChildren(
      h('section', { class: 'done', role: 'status' },
        heading,
        h('p', {}, '„' + ev.name + '“ (' + datumText(ev) + ') wurde überschrieben.'),
        h('div', { class: 'actions' },
          h('a', { class: 'btn btn-primary', href: '#/event-uebersicht/' + ev.id }, 'Event ansehen'),
          again
        )
      )
    );
    heading.focus();
  }

  function load(force) {
    Store.listEvents(force).then(events => {
      if (!wrap.isConnected) return;
      wrap.replaceChildren(bearbeitenView(events, showSaved));
    }).catch(() => {
      if (!wrap.isConnected) return;
      const retry = h('button', { type: 'button', class: 'btn btn-secondary' }, 'Erneut versuchen');
      retry.addEventListener('click', () => { wrap.replaceChildren(loading()); load(true); });
      wrap.replaceChildren(h('div', { class: 'empty' },
        h('h2', {}, 'Events konnten nicht geladen werden'),
        h('p', {}, 'Bitte prüfe die Verbindung und versuche es erneut.'),
        h('div', { class: 'actions' }, retry)));
    });
  }
  load(false);
}

const MODULES = [
  { id: 'event-anlegen',          title: 'Event anlegen',          hint: 'Neues Event erfassen',               icon: 'event-anlegen',          render: renderEventAnlegen },
  { id: 'event-bearbeiten',       title: 'Event bearbeiten',       hint: 'Angaben zu einem Event ändern',      icon: 'event-bearbeiten',       render: renderEventBearbeiten },
  { id: 'event-uebersicht',       title: 'Eventübersicht',         tileLabel: 'Event\u00ADübersicht', hint: 'Alle Events auf einen Blick',        icon: 'event-uebersicht',       render: renderUebersicht },
  { id: 'speisekarte-erzeugen',   title: 'Speisekarte generieren', hint: 'Speisekarte für ein Event erstellen',icon: 'speisekarte-erzeugen',   render: placeholder },
  { id: 'speisekarte-bearbeiten', title: 'Speisekarte bearbeiten', hint: 'Gerichte und Texte anpassen',        icon: 'speisekarte-bearbeiten', render: placeholder },
  { id: 'abrechnungsdaten',       title: 'Abrechnungsdaten',       tileLabel: 'Abrech\u00ADnungs\u00ADdaten', hint: 'Daten für die Abrechnung erfassen',  icon: 'abrechnungsdaten',       render: placeholder },
  { id: 'statistik',              title: 'Statistik',              hint: 'Umsätze und Kennzahlen im Überblick',icon: 'statistik',              render: placeholder },
];

/* ---------- Hilfsfunktionen zum Bauen von Elementen ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return el;
}

const SVG_NS = 'http://www.w3.org/2000/svg';
function svg(inner, strokeWidth) {
  const s = document.createElementNS(SVG_NS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('aria-hidden', 'true');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', strokeWidth || '1.6');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  s.innerHTML = inner;
  return s;
}
const icon = name => svg(ICONS[name] || '');

const app = document.getElementById('app');
const href = m => '#/' + m.id;

/* ---------- Startseite ---------- */
function showHome() {
  document.title = APP_NAME;
  app.replaceChildren(
    h('main', { id: 'inhalt', tabindex: '-1', class: 'home' },
      h('header', { class: 'brand' },
        h('h1', {}, APP_NAME),
        h('p', {}, 'Wähle einen Bereich.')
      ),
      h('nav', { 'aria-label': 'Bereiche' },
        h('ul', { class: 'tiles' },
          MODULES.map(m =>
            h('li', {},
              h('a', { class: 'tile', href: href(m) }, icon(m.icon), m.tileLabel || m.title)
            )
          )
        )
      )
    )
  );
}

/* ---------- Bereichsansicht ---------- */
function showModule(mod, param) {
  document.title = mod.title + ' – ' + APP_NAME;

  const body = h('div', { class: 'body' });
  mod.render(body, mod, param);

  app.replaceChildren(
    h('div', { class: 'split' },
      h('nav', { class: 'side', 'aria-label': 'Bereiche' },
        h('a', { class: 'brandlink', href: '#/' }, APP_NAME),
        h('ul', {},
          MODULES.map(m =>
            h('li', {},
              h('a', { class: 'navlink', href: href(m), 'aria-current': m.id === mod.id ? 'page' : false },
                icon(m.icon), m.title)
            )
          )
        )
      ),
      h('main', { id: 'inhalt', tabindex: '-1', class: 'content' },
        h('a', { class: 'back', href: '#/' }, svg('<path d="M15 5l-7 7 7 7"/>', '2'), 'Alle Bereiche'),
        h('h1', {}, mod.title),
        h('p', { class: 'lead' }, mod.hint),
        body
      )
    )
  );
}

/* ---------- Routing über die Adresse (#/bereich) ---------- */
let firstRoute = true;
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const mod = MODULES.find(m => m.id === parts[0]);
  mod ? showModule(mod, parts.slice(1).join('/')) : showHome();
  if (!firstRoute) {
    window.scrollTo(0, 0);
    const main = document.getElementById('inhalt');
    if (main) main.focus({ preventScroll: true });
  }
  firstRoute = false;
}
window.addEventListener('hashchange', route);
route();
</script>
